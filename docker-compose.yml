version: '3.8'

services:
  thinking-service:
    build:
      context: ./Thinking
    container_name: thinking-service
    ports:
      - "7000:7000"
    volumes:
      - /etc/models:/etc/models
      - ./SharedData:/app/SharedData
      - ./Thinking/config.env:/app/config.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - homeassist-net

  speaking-service:
    build:
      context: ./Speaking
    container_name: speaking-service
    ports:
      - "9001:9001"
    volumes:
      - /etc/models:/etc/models
      - ./SharedData:/app/SharedData
      - ./Speaking/config.env:/app/config.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - homeassist-net

networks:
  homeassist-net:
    name: homeassist-net
    driver: bridge